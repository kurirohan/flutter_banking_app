name: nexa_bank
description: NexaBank — Complete Banking Mobile App (BCT 9-Day Capstone)

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Navigation
  go_router: ^14.0.0

  # HTTP & Auth
  dio: ^5.4.3
  crypto: ^3.0.3

  # Secure Storage
  flutter_secure_storage: ^9.2.2

  # Local Database (Offline)
  hive_flutter: ^1.1.0
  hive: ^2.2.3

  # Connectivity
  connectivity_plus: ^6.0.3

  # Charts
  fl_chart: ^0.68.0

  # Utils
  uuid: ^4.4.0
  intl: ^0.19.0
  shimmer: ^3.0.0

  # Firebase
  firebase_core: ^3.3.0
  firebase_crashlytics: ^4.0.3
  firebase_messaging: ^15.0.3

  # UI
  cupertino_icons: ^1.0.8
  cached_network_image: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
#  assets:
#    - assets/images/
#    - assets/lottie/
